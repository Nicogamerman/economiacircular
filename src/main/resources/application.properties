spring.application.name=economia-circular

# Conexi�n a Cloud SQL usando Socket Factory
spring.datasource.url=jdbc:mysql://localhost:3306/eco_circular?useSSL=false&serverTimezone=UTC
spring.datasource.username=user
spring.datasource.password=devpass

spring.datasource.hikari.max-lifetime=3000000
spring.datasource.hikari.idle-timeout=600000

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Liquibase Configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.contexts=${liquibase.context:prod}
# TEMPORAL: drop-first=true elimina TODAS las tablas antes de ejecutar los changesets
# CAMBIAR A false DESPU�S DEL PRIMER DEPLOY EXITOSO
spring.liquibase.drop-first=true

server.port=${PORT:8080}
server.address=0.0.0.0

# Perfil activo para desarrollo
spring.profiles.active=dev

# Recuperación de contraseña
app.password-reset.token-ttl-minutes=60
app.password-reset.reset-url-base=${PASSWORD_RESET_URL_BASE:http://localhost:8080/reset-password}

# Verificación de email
app.email-verification.required=${EMAIL_VERIFICATION_REQUIRED:false}
app.email-verification.token-ttl-hours=48
app.email-verification.verify-url-base=${EMAIL_VERIFY_URL_BASE:http://localhost:8080/api/auth/verify-email}

# Email (deshabilitado por defecto; activar configurando SMTP y app.email.enabled=true)
app.email.enabled=${EMAIL_ENABLED:false}
app.email.from=${EMAIL_FROM:no-reply@economia-circular.local}
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Imágenes de artículos
app.article-images.max-per-article=${ARTICLE_IMAGES_MAX:5}
app.article-images.max-size-bytes=${ARTICLE_IMAGES_MAX_SIZE_BYTES:5242880}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
