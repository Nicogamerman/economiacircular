spring.application.name=economia-circular

# Conexión a la base de datos
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/eco_circular?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:devpass}

spring.datasource.hikari.max-lifetime=3000000
spring.datasource.hikari.idle-timeout=600000
# Aiven (plan gratuito) admite pocas conexiones simultáneas
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Liquibase Configuration
# Apagado por defecto en local (el esquema lo mantiene ddl-auto). En producción: LIQUIBASE_ENABLED=true
spring.liquibase.enabled=${LIQUIBASE_ENABLED:false}
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.contexts=${liquibase.context:prod}
# Poner true SOLO si querés recrear la base desde cero (borra TODAS las tablas)
spring.liquibase.drop-first=${LIQUIBASE_DROP_FIRST:false}

server.port=${PORT:8081}
server.address=0.0.0.0

# Perfil activo para desarrollo
spring.profiles.active=dev

# ========== Recuperación de contraseña ==========
app.password-reset.token-ttl-minutes=60
# URL del front donde el usuario elige la nueva contraseña (se le agrega ?token=...)
app.password-reset.reset-url-base=${PASSWORD_RESET_URL_BASE:http://localhost:5173/restablecer-contrasena}

# ========== Verificación de email ==========
app.email-verification.required=${EMAIL_VERIFICATION_REQUIRED:false}
app.email-verification.token-ttl-hours=48
# URL del front que confirma el email (se le agrega ?token=...)
app.email-verification.verify-url-base=${EMAIL_VERIFY_URL_BASE:http://localhost:5173/verificar-email}

# ========== Login con Google ==========
# Client ID de Google Cloud Console (APIs & Services > Credentials). Vacío = login con Google desactivado
app.google.client-id=${GOOGLE_CLIENT_ID:}

# ========== Email ==========
# Deshabilitado por defecto: los enlaces se imprimen en consola. Para enviar mails reales poner EMAIL_ENABLED=true y configurar SMTP
app.email.enabled=${EMAIL_ENABLED:false}
app.email.from=${EMAIL_FROM:no-reply@economia-circular.local}
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ========== Imágenes de artículos ==========
app.article-images.max-per-article=${ARTICLE_IMAGES_MAX:5}
app.article-images.max-size-bytes=${ARTICLE_IMAGES_MAX_SIZE_BYTES:5242880}
spring.servlet.multipart.enabled=true
# Cada servicio valida su propio límite (fotos 5 MB, video 30 MB, audio 5 MB)
spring.servlet.multipart.max-file-size=35MB
spring.servlet.multipart.max-request-size=40MB

# ========== Video de artículos ==========
app.article-video.max-size-bytes=${ARTICLE_VIDEO_MAX_SIZE_BYTES:31457280}

# ========== Devoluciones ==========
# Días desde que se completa un intercambio para poder pedir la devolución
app.devoluciones.plazo-dias=${DEVOLUCIONES_PLAZO_DIAS:7}

# ========== IA (Claude) ==========
# Sin API key las funciones de IA quedan desactivadas (el front las oculta)
app.ia.api-key=${ANTHROPIC_API_KEY:}
app.ia.model=${IA_MODEL:claude-opus-5-5}
app.ia.max-pedidos-por-hora=${IA_MAX_PEDIDOS_POR_HORA:30}
