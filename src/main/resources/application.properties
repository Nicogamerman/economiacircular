spring.application.name=economia-circular

# Conexión a la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/eco_circular?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=devpass

spring.datasource.hikari.max-lifetime=3000000
spring.datasource.hikari.idle-timeout=600000

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Liquibase Configuration
spring.liquibase.enabled=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.contexts=${liquibase.context:prod}
# Poner true SOLO si querés recrear la base desde cero (borra TODAS las tablas)
spring.liquibase.drop-first=${LIQUIBASE_DROP_FIRST:false}

server.port=${PORT:8081}
server.address=0.0.0.0

# Perfil activo para desarrollo
spring.profiles.active=dev

# ========== Recuperación de contraseña ==========
app.password-reset.token-ttl-minutes=60
# URL del front donde el usuario elige la nueva contraseña (se le agrega ?token=...)
app.password-reset.reset-url-base=${PASSWORD_RESET_URL_BASE:http://localhost:5173/restablecer-contrasena}

# ========== Verificación de email ==========
app.email-verification.required=${EMAIL_VERIFICATION_REQUIRED:false}
app.email-verification.token-ttl-hours=48
app.email-verification.verify-url-base=${EMAIL_VERIFY_URL_BASE:http://localhost:8081/api/auth/verify-email}

# ========== Login con Google ==========
# Client ID de Google Cloud Console (APIs & Services > Credentials). Vacío = login con Google desactivado
app.google.client-id=${GOOGLE_CLIENT_ID:}

# ========== Email ==========
# Deshabilitado por defecto: los enlaces se imprimen en consola. Para enviar mails reales poner EMAIL_ENABLED=true y configurar SMTP
app.email.enabled=${EMAIL_ENABLED:false}
app.email.from=${EMAIL_FROM:no-reply@economia-circular.local}
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ========== Imágenes de artículos ==========
app.article-images.max-per-article=${ARTICLE_IMAGES_MAX:5}
app.article-images.max-size-bytes=${ARTICLE_IMAGES_MAX_SIZE_BYTES:5242880}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
