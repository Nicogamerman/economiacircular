# ================================================================
# Configuración específica de PRODUCCIÓN
# Activa cuando SPRING_PROFILES_ACTIVE=prod (seteado en app.yaml)
# ================================================================

# SQL: no loguear queries en producción
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Liquibase: NUNCA borrar datos en producción
spring.liquibase.drop-first=false
spring.liquibase.contexts=prod

# Connection pool para Cloud SQL
# Cloud SQL cierra conexiones inactivas después de ~10 min en algunos tiers;
# max-lifetime < eso evita "Connection is closed" en horarios de baja actividad.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.keepalive-time=300000
