name: CI backend

# Corre los tests en cada push y pull request. Render despliega main
# solo si este check pasa (autoDeployTrigger: checksPass en render.yaml).
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Tests
        run: |
          chmod +x mvnw
          ./mvnw -B test
